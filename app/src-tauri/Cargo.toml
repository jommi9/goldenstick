[package]
name = "boothready-app"
description = "BoothReady desktop app (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "boothready_app"
path = "src/lib.rs"

[[bin]]
name = "boothready-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boothready-model.workspace = true
boothready-core = { workspace = true, features = ["sqlite", "fixtures"] }
boothready-platform.workspace = true
boothready-helper = { path = "../../crates/boothready-helper" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
