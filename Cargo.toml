[workspace]
resolver = "2"
members = [
    "crates/boothready-model",
    "crates/boothready-core",
    "crates/boothready-platform",
    "crates/boothready-helper",
    "crates/boothready-cli",
    "app/src-tauri",
]
default-members = [
    "crates/boothready-model",
    "crates/boothready-core",
    "crates/boothready-platform",
    "crates/boothready-helper",
    "crates/boothready-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
# Proprietary: never published to a registry.
publish = false
repository = "https://github.com/jommi9/goldenstick"
rust-version = "1.85"

[workspace.dependencies]
boothready-model = { path = "crates/boothready-model" }
boothready-core = { path = "crates/boothready-core", default-features = false }
boothready-platform = { path = "crates/boothready-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = { version = "1.8", features = ["pure"] }
walkdir = "2.5"
rusqlite = { version = "0.37", features = ["bundled"] }
ed25519-dalek = "2.2"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[workspace.lints.clippy]
# A panic is never an acceptable way to handle bad input or a failed system
# call in shipped code. Tests may still unwrap; each crate root allows it
# under cfg(test), and integration tests and examples allow it at their top.
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
