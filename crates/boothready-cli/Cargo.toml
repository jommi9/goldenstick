[package]
name = "boothready-cli"
description = "Command-line front end for BoothReady: inspect, check, plan and verify DJ USB drives."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "boothready"
path = "src/main.rs"

[dependencies]
boothready-model.workspace = true
boothready-core = { workspace = true, features = ["sqlite", "fixtures"] }
boothready-platform.workspace = true
boothready-helper = { path = "../boothready-helper" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
