[package]
name = "boothready-platform"
description = "Device discovery, watching and ejecting for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
boothready-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pure-Rust plist parsing; used for diskutil/ioreg output. Compiled on every
# OS so the parsers are unit-tested everywhere.
plist = "1.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_SystemInformation",
    "Win32_Security",
] }

[dev-dependencies]
tempfile.workspace = true
